name: battest
description: Run battest Windows batch runtime tests. The job must use windows-latest.
author: tboy1337
inputs:
  path:
    description: Path to discover tests from (file or directory)
    required: false
    default: ""
  extra-args:
    description: Extra battest run arguments. JSON string array or space-separated tokens
    required: false
    default: ""
  safe-defaults:
    description: Stub destructive external commands unless a case mocks or allows them
    required: false
    default: "true"
  python-version:
    description: Python version used to install and run battest
    required: false
    default: "3.14"
outputs:
  junit-xml:
    description: Path to the JUnit XML report written under RUNNER_TEMP
    value: ${{ steps.run-battest.outputs.junit-xml }}
runs:
  using: composite
  steps:
    - name: Require Windows runner
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -ne "Windows") {
          throw "battest requires a Windows runner (runs-on: windows-latest). Current RUNNER_OS=$env:RUNNER_OS"
        }

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install battest
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install $env:GITHUB_ACTION_PATH

    - name: Run battest
      id: run-battest
      shell: pwsh
      env:
        BATTEST_PATH: ${{ inputs.path }}
        BATTEST_EXTRA_ARGS: ${{ inputs.extra-args }}
        BATTEST_SAFE_DEFAULTS: ${{ inputs.safe-defaults }}
      run: |
        $disabled = @("false", "0", "no", "off")
        $safeValue = ""
        if ($null -ne $env:BATTEST_SAFE_DEFAULTS) {
          $safeValue = $env:BATTEST_SAFE_DEFAULTS.Trim().ToLowerInvariant()
        }
        $safe = if ($disabled -contains $safeValue) { "--no-safe-defaults" } else { "--safe-defaults" }
        $target = ""
        if ($null -ne $env:BATTEST_PATH) { $target = $env:BATTEST_PATH.Trim() }
        $extra = ""
        if ($null -ne $env:BATTEST_EXTRA_ARGS) { $extra = $env:BATTEST_EXTRA_ARGS.Trim() }
        $junit = Join-Path $env:RUNNER_TEMP "battest-junit.xml"
        $cmdArgs = @("-m", "battest", "run", $safe, "--junit-xml", $junit)
        if ($target) { $cmdArgs += $target }
        if ($extra) {
          if ($extra.StartsWith("[")) {
            try {
              $parsed = ConvertFrom-Json -InputObject $extra
            } catch {
              throw "battest extra-args is not valid JSON: $_"
            }
            if ($parsed -is [System.Management.Automation.PSCustomObject]) {
              throw "battest extra-args JSON must be an array of strings"
            }
            foreach ($item in @($parsed)) { $cmdArgs += [string]$item }
          } else {
            $cmdArgs += $extra.Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)
          }
        }
        Write-Host ("Running: python " + ($cmdArgs -join " "))
        python @cmdArgs
        $code = $LASTEXITCODE
        "junit-xml=$junit" >> $env:GITHUB_OUTPUT
        if ($code -ne 0) { exit $code }
