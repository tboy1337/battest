name: battest Action
description: Run battest Windows batch runtime tests. Requires a Windows runner.
author: tboy1337
branding:
  icon: check-square
  color: blue
inputs:
  path:
    description: Path to discover tests from (file or directory)
    required: false
    default: ""
  extra-args:
    description: Extra battest run arguments. JSON string array or space-separated tokens
    required: false
    default: ""
  safe-defaults:
    description: Stub destructive external commands unless a case mocks or allows them
    required: false
    default: "true"
  python-version:
    description: Python version used to install and run battest
    required: false
    default: "3.14"
outputs:
  junit-xml:
    description: Path to the JUnit XML report written under RUNNER_TEMP
    value: ${{ steps.run-battest.outputs.junit-xml }}
runs:
  using: composite
  steps:
    - name: Require Windows runner
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -ne "Windows") {
          throw "battest requires a Windows runner (runs-on: windows-*). Current RUNNER_OS=$env:RUNNER_OS"
        }

    - name: Resolve pip cache dependency path
      id: pip-cache
      shell: pwsh
      run: |
        if ([string]::IsNullOrWhiteSpace($env:GITHUB_ACTION_PATH)) {
          throw "GITHUB_ACTION_PATH is missing; cannot resolve pyproject.toml for pip cache"
        }
        $actionRoot = (Resolve-Path -LiteralPath $env:GITHUB_ACTION_PATH).Path
        $toml = Join-Path $actionRoot 'pyproject.toml'
        if (-not (Test-Path -LiteralPath $toml)) {
          throw "pyproject.toml is missing at $toml"
        }
        $resolved = (Resolve-Path -LiteralPath $toml).Path
        # setup-python rejects '.' / '..' in cache patterns; github.action_path
        # is often 'D:\a\repo\repo\.' when this composite action is used as ./
        $normalized = $resolved.Replace('\', '/')
        Write-Host "pip cache dependency path: $normalized"
        "path=$normalized" >> $env:GITHUB_OUTPUT

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: ${{ steps.pip-cache.outputs.path }}

    - name: Install battest
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        python -m pip install -- "$env:GITHUB_ACTION_PATH"

    - name: Run battest
      id: run-battest
      shell: pwsh
      env:
        BATTEST_PATH: ${{ inputs.path }}
        BATTEST_EXTRA_ARGS: ${{ inputs.extra-args }}
        BATTEST_SAFE_DEFAULTS: ${{ inputs.safe-defaults }}
      run: |
        & "$env:GITHUB_ACTION_PATH/scripts/run-battest-action.ps1"
        exit $LASTEXITCODE
