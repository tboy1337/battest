deprecated_commands:
  at: Deprecated Windows command (use schtasks)
  bitsadmin: Deprecated Windows command (use BITS PowerShell cmdlets)
  cacls: Deprecated Windows command (use icacls)
  caspol: Deprecated .NET Framework CAS policy tool (still ships with Framework)
  dpath: Deprecated undocumented CMD internal (legacy APPEND equivalent; still responds to /?)
  keys: Deprecated DOS-compatibility CMD internal (still recognized; prints status / accepts ON|OFF but has no effect under Windows because command-line editing is always enabled)
  winrm: Deprecated Windows command (use PowerShell WinRM cmdlets)
  wmic: Deprecated Windows command (not installed by default on Windows 11 24H2+; optional FoD)

removed_commands:
  append: Absent on modern Windows hosts (not a supported cmd.exe internal; historical DOS APPEND)
  assign: Removed since Windows NT (not supported in cmd.exe)
  backup: Removed since Windows NT (replaced by ntbackup then wbadmin)
  browstat: Windows Resource Kit add-on tool (browser status); not a stock cmd.exe command
  diskcomp: Removed Windows command
  diskcopy: Removed Windows command
  edlin: Historical DOS line editor; not present on 64-bit Windows (was a 16-bit NTVDM tool on 32-bit editions only)
  graftabl: Removed / unavailable on modern Windows (still listed by HELP; binary not present)
  inuse: Windows Resource Kit add-on tool; not a stock cmd.exe command
  join: Removed since Windows NT (not supported in cmd.exe)
  streams: Sysinternals Streams tool; not a stock cmd.exe command

older_windows_commands:
  - command
  - debug
  - edit
  - fastopen
  - graphics
  - keyb
  - loadfix
  - mem
  - mirror
  - nlsfunc
  - qbasic
  - share
  - undelete
  - unformat

common_command_typos:
  caal: call
  ecko: echo
  ecoh: echo
  exitt: exit
  forx: for
  fro: for
  goot: goto
  iff: if
  sett: set

builtin_overlap_deprecated_notes:
  wmic: >-
    Listed in stock_windows_utilities / builtin_commands and
    deprecated_commands: still present for detection on modern Windows, but
    deprecated in favor of CIM/PowerShell.
  dpath: >-
    Listed in cmd_internal_commands / builtin_commands and deprecated_commands:
    still a recognized cmd internal (legacy APPEND equivalent) but
    deprecated/undocumented for new scripts. The HELP utility does not list it
    ("This command is not supported by the help utility. Try \"dpath /?\".");
    use dpath /? (see audit/cmd-help/dpath-help.txt).
  keys: >-
    Listed in cmd_internal_commands / builtin_commands and deprecated_commands:
    still recognized as a DOS-compatibility internal but has no effect under
    modern Windows command-line editing. The HELP utility does not list it
    ("Try \"keys /?\"."); use keys /? (see audit/cmd-help/keys-help.txt).
  telnet: >-
    Listed in stock_windows_utilities / builtin_commands for detection, but the
    Telnet client is an optional Windows Feature / FoD component and is often
    absent (where telnet fails). Treat like other optional stock tools; do not
    assume it is installed.
  curl: >-
    Listed in stock_windows_utilities / builtin_commands for detection as a
    stock Windows utility since Windows 10 1803+, but availability can still
    vary on older or stripped images. Treat as optional when targeting
    down-level hosts.
  tar: >-
    Listed in stock_windows_utilities / builtin_commands for detection as a
    stock Windows utility on modern Windows 10/11, but availability can vary on
    older hosts. Treat as optional when targeting down-level images.
