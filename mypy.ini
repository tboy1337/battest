[mypy]
python_version = 3.12
mypy_path = src
packages = battest
strict = true

disallow_any_generics = true
disallow_any_unimported = true
disallow_any_expr = true
disallow_any_explicit = true
disallow_any_decorated = true

disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_subclassing_any = true

no_implicit_reexport = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true

strict_equality = true
strict_concatenate = true

platform = win32

show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

[mypy-charset_normalizer.*]
ignore_missing_imports = true
follow_imports = skip

[mypy-battest.encoding]
disallow_any_expr = false
disallow_any_explicit = false
disallow_any_unimported = false

[mypy-battest.models]
disallow_any_explicit = false
disallow_any_expr = false
disallow_any_unimported = false

[mypy-battest.schema]
disallow_any_explicit = false
disallow_any_expr = false
disallow_any_unimported = false

[mypy-battest.spec]
disallow_any_explicit = false
disallow_any_expr = false
disallow_any_unimported = false

[mypy-battest.cli]
disallow_any_expr = false

[mypy-battest.report]
warn_unreachable = false

[mypy-battest.assertlib]
warn_unreachable = false

[mypy-pytest.*]
follow_imports = skip

[mypy-tests.*]
disallow_any_decorated = false
disallow_any_expr = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_unimported = false
disallow_any_explicit = false
warn_return_any = false
strict_equality = false
warn_unreachable = false
disable_error_code = union-attr,arg-type,misc,no-any-unimported,unreachable

[mypy-verify]
disallow_any_expr = false
warn_return_any = false

[mypy-generate_spec_data]
disallow_any_expr = false
warn_return_any = false

# pydantic BaseModel and argparse.Namespace leak Any into this script
[mypy-check_coverage]
disallow_any_expr = false
disallow_any_explicit = false
disallow_any_unimported = false
warn_return_any = false
disable_error_code = explicit-any,misc

[mypy-check_rust_coverage]
disallow_any_expr = false
disallow_any_explicit = false
disallow_any_unimported = false
warn_return_any = false
disable_error_code = explicit-any,misc

[mypy-build_stub]
disallow_any_expr = false
warn_return_any = false
warn_unreachable = false
