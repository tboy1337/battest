name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Static analysis and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run quality checks
        run: |
          python scripts/generate_spec_data.py --check
          python -m black --check src tests scripts
          python -m isort --check-only src tests scripts
          python -m autopep8 -r --diff --exit-code --select=W291,W293 src tests scripts
          python -m mypy src/battest tests scripts
          python -m pylint src/battest
          python -m pyproject_fmt --check pyproject.toml
          python -m bandit -r src/battest -c pyproject.toml -ll -q
          python -m pip_audit -r requirements.txt -r requirements-dev.txt

  test-unit:
    name: pytest unit (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Copy spec catalogs
        run: python scripts/generate_spec_data.py

      - name: Run unit tests
        run: python -m pytest -m "not windows"

  test-windows:
    name: pytest windows (${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Copy spec catalogs
        run: python scripts/generate_spec_data.py

      - name: Rebuild PATH-mock stub
        run: python scripts/build_stub.py

      - name: Fail if packaged stub PE drifted
        run: git diff --exit-code -- src/battest/data/battest_stub.exe

      - name: Run full tests
        run: python -m pytest

      - name: Check line, branch, function, and class coverage
        run: python scripts/check_coverage.py

      - name: Run example suites
        run: python -m battest run examples --safe-defaults

  action-windows:
    name: Composite action dogfood
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - id: battest
        uses: ./
        with:
          path: examples
          safe-defaults: "true"

      - name: Assert JUnit report exists
        shell: pwsh
        run: |
          $path = "${{ steps.battest.outputs.junit-xml }}"
          if (-not (Test-Path -LiteralPath $path)) {
            throw "junit-xml output is missing: $path"
          }
          if ((Get-Item -LiteralPath $path).Length -lt 1) {
            throw "junit-xml is empty: $path"
          }

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
          - language: rust
            build-mode: manual
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build Rust stub
        if: matrix.language == 'rust'
        run: cargo build --manifest-path stub/Cargo.toml --locked

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  rust-quality:
    name: Rust format, check, clippy, coverage, audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stub

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-audit

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install coverage gate dependencies
        run: python -m pip install pydantic

      - name: rustfmt
        run: cargo fmt --all --check --manifest-path stub/Cargo.toml

      - name: cargo check
        run: cargo check --manifest-path stub/Cargo.toml --all-targets --locked

      - name: clippy
        run: >
          cargo clippy --manifest-path stub/Cargo.toml --all-targets --locked
          -- -D warnings

      - name: coverage
        run: python scripts/check_rust_coverage.py

      - name: cargo audit
        run: cargo audit --file stub/Cargo.lock

  rust-test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stub

      - name: cargo check
        run: cargo check --manifest-path stub/Cargo.toml --all-targets --locked

      - name: cargo test
        run: cargo test --manifest-path stub/Cargo.toml --locked --all-targets
